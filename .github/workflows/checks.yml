name: Workspace checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test discovery, exact certificates, providers and synchronization
        run: python3 -m unittest discover -s tests -v
      - name: Validate manifests
        run: |
          python3 -m json.tool quantumlib-lock.json > /dev/null
          python3 -m json.tool toolkit-lock.json > /dev/null
          python3 -m json.tool data/research-portfolio.json > /dev/null
          python3 -m json.tool config/research-watch.json > /dev/null
          python3 -m json.tool config/research-tasks.json > /dev/null
          python3 -m json.tool config/challenge-targets.json > /dev/null
          python3 -m json.tool data/research-radar.json > /dev/null
      - name: Run and independently verify a mathematics example
        run: |
          python3 anaxia.py solve examples/quadratic-sos.json --output /tmp/anaxia-proof.json
          python3 anaxia.py verify /tmp/anaxia-proof.json
          python3 anaxia.py diophantine examples/modular-obstruction.json --output /tmp/anaxia-modular.json
          python3 anaxia.py diophantine /tmp/anaxia-modular.json --verify
          python3 anaxia.py challenge run --profile quick --output /tmp/anaxia-challenges
          python3 anaxia.py audit examples/audit/synthetic-claims.json --output /tmp/anaxia-audits
      - name: Replay exact calculations for the research notes
        run: |
          python3 scripts/audit_d4_radial_reduction.py
          python3 scripts/verify_d4_grid.py
          python3 scripts/verify_d4_intermediate_grid.py --output data/d4-intermediate-grid.json
          python3 scripts/verify_d4_partial_contacts.py
          python3 scripts/verify_d4_vacancy.py --output data/d4-vacancy.json
          python3 scripts/check_rh_reciprocal_coefficients.py
          python3 scripts/check_thermal_gap_identifiability.py
          python3 scripts/check_yang_mills_one_scale.py
          git diff --exit-code -- data/d4-radial-audit.json data/d4-grid.json data/d4-intermediate-grid.json data/d4-vacancy.json
